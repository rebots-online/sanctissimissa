[package]
name = "sanctissimissa"
version = "1.54.28154"
description = "SanctissiMissa — the Traditional Latin Mass and Divine Office as a navigable subway map"
authors = ["Robin L. M. Cheung, MBA"]
edition = "2021"

[lib]
name = "sanctissimissa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
[features]
default = ["native-inference"]
native-inference = ["dep:llama-cpp-2"]

# CP.7 native inference — target-gated: Windows cross-build (cargo-xwin,
# clang < 19) cannot compile llama.cpp, and 32-bit (armv7) Android is outside
# llama.cpp's reliable 32-bit support. Those targets ship honestly without
# the native engine; 64-bit desktop + arm64 Android get the real engine.
[target.'cfg(all(not(target_os = "windows"), target_pointer_width = "64"))'.dependencies]
llama-cpp-2 = { version = "0.1.156", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
