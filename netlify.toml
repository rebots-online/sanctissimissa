[build]
  publish = "dist-web"
  command = "npm run build"

# BK.1 (§K.1) — billing functions: /billing/key, /billing/access.
# Secrets (OPENROUTER_ADMIN_KEY, FIREBASE_ADMIN_*) are server env only —
# never VITE_*, never in any client bundle (SK.5 semantic check).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/missal.db"
  [headers.values]
    Cache-Control = "public, max-age=86400"
